[package]
name = "mdd-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
cda-core = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", branch = "main" }
cda-database = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", branch = "main" }
cda-interfaces = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", branch = "main" }
cda-plugin-security = { git = "https://github.com/eclipse-opensovd/classic-diagnostic-adapter.git", branch = "main" }

# Error handling
anyhow = "1"

# Serialization (for Tauri command return types)
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[lints]
workspace = true
