[package]
name = "mdd-tauri"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mdd-core = { path = "../mdd-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
similar_names = "allow"
clone_on_ref_ptr = "warn"
unwrap_used = "deny"
