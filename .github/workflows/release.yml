name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── Step 1: create a draft release and expose its ID ────────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `MDD UI ${context.ref.replace('refs/tags/', '')}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
            });
            return data.id;
          result-encoding: string

  # ── Step 2: build Tauri bundles for every platform ──────────────────────────
  build-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Inject version from tag
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          python3 - << 'EOF'
          import os, re, json
          v = os.environ['VERSION']

          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['version'] = v
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')

          with open('Cargo.toml') as f:
              text = f.read()
          # Replace version only in [package] section (first occurrence)
          text = re.sub(r'^version = "[^"]+"', f'version = "{v}"', text, count=1, flags=re.MULTILINE)
          with open('Cargo.toml', 'w') as f:
              f.write(text)
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/install-linux-deps

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # ── Step 3: merge per-platform signatures into one latest.json ──────────────
  merge-updater-json:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate multi-platform latest.json
        uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const releaseId = parseInt(process.env.RELEASE_ID);
            const version   = process.env.VERSION;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            // Map Tauri bundle suffixes → updater platform keys
            const platformPatterns = {
              'darwin-aarch64': [/aarch64\.dmg$/i, /aarch64\.app\.tar\.gz$/i],
              'linux-x86_64':   [/amd64\.AppImage$/i, /x86_64\.AppImage$/i],
              'windows-x86_64': [/x64-setup\.exe$/i, /x64\.msi$/i],
            };

            const platforms = {};

            for (const [platform, patterns] of Object.entries(platformPatterns)) {
              const bundle = assets.find(a => patterns.some(p => p.test(a.name)));
              if (!bundle) { core.warning(`No bundle found for ${platform}`); continue; }

              const sig = assets.find(a => a.name === bundle.name + '.sig');
              if (!sig) { core.warning(`No .sig found for ${bundle.name}`); continue; }

              // Download signature (small text file, public asset on draft release via token)
              const sigResp = await github.request(`GET /repos/${context.repo.owner}/${context.repo.repo}/releases/assets/${sig.id}`, {
                headers: { accept: 'application/octet-stream' },
              });
              const signature = Buffer.from(sigResp.data).toString('utf-8').trim();

              platforms[platform] = {
                signature,
                url: bundle.browser_download_url,
              };
            }

            if (Object.keys(platforms).length === 0) {
              core.setFailed('No platform bundles found — cannot generate latest.json');
              return;
            }

            const updaterJson = {
              version: `v${version}`,
              notes: '',
              pub_date: new Date().toISOString(),
              platforms,
            };

            // Remove stale latest.json (written per-platform by tauri-action)
            const existing = assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(updaterJson, null, 2),
            });

            core.info(`Uploaded latest.json with platforms: ${Object.keys(platforms).join(', ')}`);

  # ── Step 4: publish the release ─────────────────────────────────────────────
  publish-release:
    needs: [create-release, merge-updater-json]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
