name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  # ── Step 1: build Tauri bundles for every platform ──────────────────────────
  # tauri-action creates/finds the draft release by tag; all matrix jobs upload
  # to it concurrently without a shared release_id — no cross-job ID passing.
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Inject version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - << EOF
          import os, re, json
          v = "${VERSION}"

          with open('tauri.conf.json') as f:
              cfg = json.load(f)
          cfg['version'] = v
          with open('tauri.conf.json', 'w') as f:
              json.dump(cfg, f, indent=2)
              f.write('\n')

          with open('Cargo.toml') as f:
              text = f.read()
          # Replace version only in [package] section (first occurrence)
          text = re.sub(r'^version = "[^"]+"', f'version = "{v}"', text, count=1, flags=re.MULTILINE)
          with open('Cargo.toml', 'w') as f:
              f.write(text)
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: ./.github/actions/install-linux-deps

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MDD UI ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ── Step 2: merge per-platform signatures into one latest.json ─────────────
  merge-updater-json:
    needs: build-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate multi-platform latest.json
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            const version  = tagName.replace(/^v/, '');

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tagName,
            });
            const releaseId = release.id;

            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              per_page: 100,
            });

            // Map Tauri bundle suffixes → updater platform keys
            const platformPatterns = {
              'darwin-aarch64': [/aarch64\.app\.tar\.gz$/i, /aarch64\.dmg$/i],
              'linux-x86_64':   [/amd64\.AppImage\.tar\.gz$/i, /x86_64\.AppImage\.tar\.gz$/i, /amd64\.AppImage$/i, /x86_64\.AppImage$/i],
              'windows-x86_64': [/x64-setup\.exe$/i, /x64\.msi$/i],
            };

            const platforms = {};

            for (const [platform, patterns] of Object.entries(platformPatterns)) {
              const bundle = assets.find(a => patterns.some(p => p.test(a.name)));
              if (!bundle) { core.warning(`No bundle found for ${platform}`); continue; }

              const sig = assets.find(a => a.name === bundle.name + '.sig');
              if (!sig) { core.warning(`No .sig found for ${bundle.name}`); continue; }

              // Download signature (small text file)
              const sigResp = await github.request(`GET /repos/${context.repo.owner}/${context.repo.repo}/releases/assets/${sig.id}`, {
                headers: { accept: 'application/octet-stream' },
              });
              const signature = Buffer.from(sigResp.data).toString('utf-8').trim();

              platforms[platform] = {
                signature,
                url: bundle.browser_download_url,
              };
            }

            if (Object.keys(platforms).length === 0) {
              core.setFailed('No platform bundles found — cannot generate latest.json');
              return;
            }

            const updaterJson = {
              version: `v${version}`,
              notes: '',
              pub_date: new Date().toISOString(),
              platforms,
            };

            // Remove stale latest.json (written per-platform by tauri-action)
            const existing = assets.find(a => a.name === 'latest.json');
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: existing.id,
              });
            }

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
              name: 'latest.json',
              data: JSON.stringify(updaterJson, null, 2),
            });

            core.info(`Uploaded latest.json with platforms: ${Object.keys(platforms).join(', ')}`);

