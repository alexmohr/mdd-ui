name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    uses: eclipse-opensovd/cicd-workflows/.github/workflows/tauri-release.yml@c90c3ffebead613b4b6fc9ab1162a52b253d3ccf
    with:
      app-name: "MDD UI"
      app-binary-name: "mdd-ui"
      rust-version: "1.88.0"
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
