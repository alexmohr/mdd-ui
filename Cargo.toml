[workspace]
members = ["crates/mdd-core", "crates/mdd-tauri"]
default-members = ["."]

[package]
name = "mdd-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
mcp = ["dep:rmcp", "dep:tokio", "dep:serde_json"]

[dependencies]
mdd-core = { path = "crates/mdd-core" }

# TUI
ratatui = "0.30.0"
crossterm = "0.29.0"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"

# Clipboard
arboard = "3"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# MCP server (optional)
rmcp = { version = "1.5", features = [
  "server",
  "transport-io",
  "macros",
], optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }
serde_json = { version = "1", optional = true }

[patch.crates-io]
flatbuffers = { git = "https://github.com/alexmohr/flatbuffers.git", rev = "0ba3307d" }

[lints.clippy]
# enable pedantic
pedantic = { level = "warn", priority = -1 }
## exclude some too pedantic lints for now
similar_names = "allow"

# additional lints
clone_on_ref_ptr = "warn"
indexing_slicing = "deny"
unwrap_used = "deny"
arithmetic_side_effects = "deny"
separated_literal_suffix = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(nightly)'] }
